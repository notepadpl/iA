name: Build WASM and Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]

# Uprawnienia wymagane przez oficjalne akcje Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Klonowanie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Emscripten SDK
        uses: mymindstorm/setup-emscripten@v14
        with:
          emscripten-version: '3.1.56'

      - name: Utworzenie folderu wyjściowego (public)
        run: mkdir public

      - name: Kompilacja C++ do WebAssembly (em++)
        run: |
          em++ main.cpp -O3 \
            -s WASM=1 \
            -s EXPORTED_RUNTIME_METHODS='["cwrap", "ccall"]' \
            -s EXPORTED_FUNCTIONS="['_analyze_network_traffic']" \
            -s ALLOW_MEMORY_GROWTH=1 \
            -o public/index.js

      - name: Skopiowanie pliku HTML i modelu ONNX do folderu publicznego
        run: |
          # Załóżmy, że masz index.html i network_anomaly.onnx w głównym katalogu
          cp index.html public/
          if [ -f network_anomaly.onnx ]; then cp network_anomaly.onnx public/; fi

      - name: Przesłanie artefaktu strony
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wdrożenie na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
