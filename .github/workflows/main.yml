name: Build and Deploy to gh-pages

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Klonowanie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Emscripten SDK
        uses: mymindstorm/setup-emscripten@v14
        with:
          emscripten-version: '3.1.56'

      - name: Utworzenie folderu wyjściowego
        run: mkdir public

      - name: Kompilacja C++ do WebAssembly (em++) z Dżinem Blogowym
        run: |
          em++ main.cpp -O3 --preload-file assets/network_anomaly.onnx \
            -s WASM=1 \
            -s EXPORTED_RUNTIME_METHODS='["cwrap", "ccall", "UTF8ToString"]' \
            -s EXPORTED_FUNCTIONS="['_analyze_network_traffic', '_process_client_ip', '_execute_shell_command', '_summon_genie', '_talk_to_genie', '_ask_genie_blog', '_malloc', '_free']" \
            -s ALLOW_MEMORY_GROWTH=1 \
            -o public/index.js

      - name: Skopiowanie pliku HTML
        run: |
          cp index.html public/

      - name: Wypchnięcie na gałąź gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public
          branch: gh-pages
          clean: true
