<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>WASM & AI Network Monitor</title>
    <!-- Ładowanie skryptu wygenerowanego przez em++ -->
    <script src="index.js"></script>
</head>
<body style="background: #121212; color: #00ffcc; font-family: monospace; padding: 20px;">
    <h1>[ Monitor IA + C++ WASM ]</h1>
    <p>Status: <span id="status" style="color: yellow;">Inicjalizacja modułu...</span></p>
    <p>Wynik analizy z C++: <strong id="result" style="color: #fff; font-size: 1.2em;">-</strong></p>

  <script>
        var Module = {
            onRuntimeInitialized: function() {
                document.getElementById('status').innerText = "Moduł C++ działa w WebAssembly! 🔥";
                
                const ping = 35.4;
                const payload = 1024.0;
                const rate = 2.1;

                // Szukamy funkcji na obiekcie Module z podkreśleniem _
                if (typeof Module._analyze_network_traffic === 'function') {
                    const score = Module._analyze_network_traffic(ping, payload, rate);
                    document.getElementById('result').innerText = score.toFixed(4);
                } else {
                    document.getElementById('result').innerText = "Błąd: Nie znaleziono funkcji w module Module";
                }
            }
        };
    </script>
</body>
</html>
